; PlatformIO project for ESP32-S2 + Waveshare 1.28" round GC9A01 240x240 LCD
[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv ; no OTA needed; frees up flash for the app
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.4
